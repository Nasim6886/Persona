<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one hairline top bar, masonry feed, profiles as a centered editorial header over the same grid. */
:root{
  --bg:#ffffff; --fg:#0a0a0a; --muted:#6e6e6e; --line:#e8e8e8; --soft:#f4f4f4; --inv-bg:#0a0a0a; --inv-fg:#ffffff;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--fg:#f2f2f2;--muted:#8d8d8d;--line:#222;--soft:#161616;--inv-bg:#f2f2f2;--inv-fg:#0b0b0b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0b;--fg:#f2f2f2;--muted:#8d8d8d;--line:#222;--soft:#161616;--inv-bg:#f2f2f2;--inv-fg:#0b0b0b;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:3px;border-radius:6px}
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1680px;margin:0 auto}

/* Top bar */
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{font:400 26px/1 var(--serif);letter-spacing:-.01em}
.logo i{font-style:italic}
.search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-radius:999px;background:var(--soft);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);outline:none}
.nav{display:flex;gap:6px;align-items:center}
.pill{height:36px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;font-weight:500;font-size:13px;transition:background .2s}
.pill:hover{background:var(--soft)}
.pill.solid{background:var(--inv-bg);color:var(--inv-fg)}
.pill.solid:hover{opacity:.86;background:var(--inv-bg)}

/* Home intro + filters */
.intro{padding-block:48px 28px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
.intro h1{margin:0;font:400 clamp(40px,6vw,76px)/.95 var(--serif);letter-spacing:-.02em;text-wrap:balance;max-width:14ch}
.intro h1 i{font-style:italic;color:var(--muted)}
.intro p{margin:0;color:var(--muted);max-width:36ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:24px}
.chip{height:34px;padding:0 15px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--fg);border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}

/* Masonry */
.grid{columns:5 240px;column-gap:16px;padding-bottom:80px}
.pin{break-inside:avoid;margin:0 0 22px;display:block;cursor:zoom-in}
.pin .ph{position:relative;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.pin img{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .4s}
.pin:hover img{transform:scale(1.03)}
.pin .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 45%);opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;padding:14px;color:#fff;font-size:12px;letter-spacing:.02em}
.pin:hover .ov{opacity:1}
.save{position:absolute;top:12px;right:12px;height:32px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font-size:12px;font-weight:600;opacity:0;transition:opacity .25s}
.pin:hover .save,.save.on{opacity:1}
.save.on{background:#000;color:#fff}
.meta{display:flex;align-items:center;gap:8px;padding:10px 2px 0}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--soft);flex:none}
.meta b{font-weight:500;font-size:13px}
.meta span{color:var(--muted);font-size:12px;margin-left:auto}
.cap{padding:2px 2px 0;font-size:13px;color:var(--muted);line-height:1.4}
.fallback{aspect-ratio:3/4;display:grid;place-items:center;font:italic 28px var(--serif);color:var(--muted)}

/* Profile */
.prof{padding-block:56px 40px;display:grid;justify-items:center;text-align:center;gap:14px}
.prof .big{width:132px;height:132px;border-radius:50%;object-fit:cover;background:var(--soft)}
.ai{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ai::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg)}
.prof h2{margin:0;font:400 clamp(44px,6vw,64px)/1 var(--serif);letter-spacing:-.02em}
.handle{color:var(--muted);font-size:14px}
.bio{max-width:52ch;margin:4px 0 0;font-size:15px;line-height:1.6;text-wrap:pretty}
.by{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.by .mono{width:22px;height:22px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;font-size:10px;font-weight:600}
.by a{color:var(--fg);font-weight:500;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:28px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;color:var(--fg);font-size:18px;font-weight:500}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:520px}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:8px}
.btn{height:44px;padding:0 22px;border-radius:999px;font-weight:500;border:1px solid var(--line)}
.btn.solid{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.tabs{display:flex;justify-content:center;gap:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.tab{padding:14px 2px;font-weight:500;color:var(--muted);border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--fg)}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;padding-bottom:80px}
.board .mos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.board .mos img{width:100%;height:100%;object-fit:cover}
.board .mos img:first-child{grid-row:span 2}
.board h4{margin:10px 2px 0;font-weight:500;font-size:15px}
.board p{margin:0 2px;color:var(--muted);font-size:12px}

/* Creators strip on home */
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:28px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.who{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border:1px solid var(--line);border-radius:999px;transition:border-color .2s}
.who:hover{border-color:var(--fg)}
.who img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--soft)}
.who b{font-weight:500;font-size:13px;display:block;line-height:1.2}
.who small{color:var(--muted);font-size:11px}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.card{background:var(--bg);border:1px solid var(--line);border-radius:28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);max-width:1000px;width:100%;max-height:min(88vh,820px);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.card .img{background:var(--soft);min-height:0}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .side{padding:28px;display:flex;flex-direction:column;gap:18px;overflow:auto;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:center}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.x:hover{background:var(--soft)}
.card h3{margin:0;font:400 34px/1.05 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.card .prompt{font-size:13px;color:var(--muted);padding:14px;border-radius:12px;background:var(--soft);line-height:1.55}
.card .prompt em{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;color:var(--fg)}
.owner{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.owner img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.owner b{display:block;font-weight:500}
.owner small{color:var(--muted)}
.owner .btn{margin-left:auto}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:760px){
  .search{display:none}
  .bar .wrap{justify-content:space-between}
  .nav .pill:not(.solid){display:none}
  .grid{columns:2;column-gap:10px}
  .pin{margin-bottom:16px}
  .card{grid-template-columns:1fr;max-height:90vh;overflow:auto;border-radius:22px}
  .card .img{max-height:56vh}
  .save{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="logo" href="#home">Per<i>sona</i></a>
    <label class="search" for="q">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search characters, brands, aesthetics">
    </label>
    <nav class="nav">
      <a class="pill" href="#home">Explore</a>
      <a class="pill" href="#home">Creators</a>
      <a class="pill solid" href="#home">Create persona</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer><div class="wrap"><span>Persona: a gallery of AI characters and brands, made by human creators.</span><span>MVP · sample content</span></div></footer>

<div class="lb" id="lb" hidden></div>

<script>
/* ---------- DATA (swap image URLs here) ---------- */
const U = (id, w=900) => `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80`;

const characters = [
  {
    id:"noor", name:"Noor Vale", handle:"@noor.vale", kind:"Character",
    creator:{name:"Lena Ortiz", handle:"@lenaortiz"},
    bio:"Quiet-luxury muse. Lives in soft light, linen and long lenses. Noor models for slow-fashion labels and never posts before noon.",
    tags:["quiet luxury","film grain","editorial","neutral palette"],
    followers:"184K", pins:"6", boards:2,
    avatar:"photo-1534528741775-53994a69daeb",
    images:[
      ["photo-1534528741775-53994a69daeb","Window light, Tuesday","85mm portrait, soft window light, monochrome styling, shallow depth of field"],
      ["photo-1515886657613-9f3515b0c78f","The long coat","full-length editorial, oversized wool coat, concrete backdrop"],
      ["photo-1529626455594-4ff0802cfb7e","Gold hour","outdoor portrait, late sun, linen blouse, wind in hair"],
      ["photo-1524504388940-b1c1722653e1","Studio, no makeup","studio headshot, bare skin, white seamless, high key"],
      ["photo-1488426862026-3ee34a7d66df","Between takes","candid portrait, natural expression, warm tone"],
      ["photo-1487412720507-e7ab37603c6f","Still life with Noor","close portrait, muted palette, film emulation"],
    ]
  },
  {
    id:"kai", name:"Kai Mercer", handle:"@kai.mercer", kind:"Character",
    creator:{name:"Daniel Osei", handle:"@dosei"},
    bio:"Menswear character built for tailoring houses. Sharp shoulders, sharper jawline. Kai is cast for campaigns that need a face that photographs in black and white.",
    tags:["tailoring","monochrome","campaign","street"],
    followers:"92K", pins:"6", boards:2,
    avatar:"photo-1507003211169-0a1dd7228f2d",
    images:[
      ["photo-1507003211169-0a1dd7228f2d","Portrait No. 4","tight portrait, soft key light, beard detail, neutral background"],
      ["photo-1500648767791-00dcc994a43e","Off duty","natural light headshot, relaxed expression, outdoor"],
      ["photo-1519085360753-af0119f7cbe7","The navy suit","tailored suit, three-quarter length, studio"],
      ["photo-1506794778202-cad84cf45f1d","Grey morning","overcast portrait, desaturated, direct gaze"],
      ["photo-1492562080023-ab3db95bfbce","Leather and rain","street portrait, leather jacket, urban backdrop"],
      ["photo-1504593811423-6dd665756598","Monday face","casual headshot, shallow focus, minimal styling"],
    ]
  },
  {
    id:"maison", name:"Maison Ivo", handle:"@maison.ivo", kind:"Brand",
    creator:{name:"Studio Haru", handle:"@studioharu"},
    bio:"An AI-native fashion house. No atelier, no runway, just a cast of synthetic faces wearing collections that exist only as images. Drop 03 is live.",
    tags:["fashion house","drop 03","virtual runway","lookbook"],
    followers:"311K", pins:"6", boards:3,
    avatar:"photo-1509631179647-0177331693ae",
    images:[
      ["photo-1509631179647-0177331693ae","Drop 03, look 1","fashion lookbook, structured silhouette, studio"],
      ["photo-1496747611176-843222e1e57c","Drop 03, look 4","editorial fashion, color-blocked dress, minimal set"],
      ["photo-1483985988355-763728e1935b","The shop that isn't","retail concept, garment bags, lifestyle"],
      ["photo-1485875437342-9b39470b3d95","Campaign: Arrival","outdoor campaign, wide-brim hat, summer light"],
      ["photo-1517841905240-472988babdf9","Face of the season","beauty portrait, crisp light, direct gaze"],
      ["photo-1531746020798-e6953c6e8e04","Backstage, virtually","beauty close-up, soft texture, studio"],
    ]
  }
];

/* flatten + interleave for the home feed */
const pins = [];
for (let i=0;i<6;i++) characters.forEach(c=>{const [id,title,prompt]=c.images[i]; pins.push({id,title,prompt,c});});

/* ---------- RENDER ---------- */
const app = document.getElementById("app");
const lb = document.getElementById("lb");
const saved = new Set();
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const imgTag = (id,w,alt,cls="") => `<img class="${cls}" src="${U(id,w)}" alt="${esc(alt)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;fallback&quot;>${esc(alt).slice(0,1)}</div>'">`;

function pinHTML(p, showMeta=true){
  const k = pins.indexOf(p);
  return `<article class="pin" data-k="${k}">
    <div class="ph">${imgTag(p.id,600,p.title)}
      <div class="ov">${esc(p.c.kind)} · ${esc(p.c.name)}</div>
      <button class="save ${saved.has(k)?"on":""}" data-save="${k}">${saved.has(k)?"Saved":"Save"}</button>
    </div>
    ${showMeta?`<div class="meta"><img class="av" src="${U(p.c.avatar,80)}" alt=""><b>${esc(p.c.name)}</b><span>by ${esc(p.c.creator.handle)}</span></div>`
      :`<div class="cap">${esc(p.title)}</div>`}
  </article>`;
}

let filter = "All";
function home(){
  const list = pins.filter(p => filter==="All" || p.c.kind+"s"===filter);
  app.innerHTML = `
  <div class="wrap">
    <section class="intro">
      <h1>Faces that <i>don't exist</i>, made by people who do.</h1>
      <p>Follow AI characters and brands, save their work, and meet the human creators behind them.</p>
    </section>
    <div class="strip">${characters.map(c=>`
      <a class="who" href="#${c.id}"><img src="${U(c.avatar,120)}" alt=""><span><b>${esc(c.name)}</b><small>${c.kind} · ${c.followers}</small></span></a>`).join("")}
    </div>
    <div class="chips" role="group" aria-label="Filter">
      ${["All","Characters","Brands"].map(f=>`<button class="chip" aria-pressed="${f===filter}" data-f="${f}">${f}</button>`).join("")}
    </div>
    <section class="grid">${list.map(p=>pinHTML(p)).join("")}</section>
  </div>`;
}

let tab = "pins";
function profile(c){
  const mine = pins.filter(p=>p.c===c);
  const boards = [
    {t:"Editorial", n:4, ix:[0,1,2]},
    {t:"Portraits", n:3, ix:[3,4,5]},
    {t:"Unreleased", n:2, ix:[5,0,3]},
  ].slice(0,c.boards);
  app.innerHTML = `
  <div class="wrap">
    <section class="prof">
      <img class="big" src="${U(c.avatar,300)}" alt="${esc(c.name)}">
      <span class="ai">AI ${c.kind}</span>
      <h2>${esc(c.name)}</h2>
      <div class="handle">${esc(c.handle)}</div>
      <p class="bio">${esc(c.bio)}</p>
      <div class="by"><span class="mono">${esc(c.creator.name.split(" ").map(w=>w[0]).join(""))}</span>Created by <a href="#home">${esc(c.creator.name)}</a></div>
      <div class="stats"><div><b>${c.followers}</b>followers</div><div><b>${c.images.length}</b>pins</div><div><b>${c.boards}</b>boards</div></div>
      <div class="tags">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="actions"><button class="btn solid" id="follow">Follow</button><button class="btn" id="share">Share</button></div>
    </section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="${tab==="pins"}" data-tab="pins">Created</button>
      <button class="tab" role="tab" aria-selected="${tab==="boards"}" data-tab="boards">Boards</button>
    </div>
    ${tab==="pins"
      ? `<section class="grid">${mine.map(p=>pinHTML(p,false)).join("")}</section>`
      : `<section class="boards">${boards.map(b=>`<div class="board"><div class="mos">${b.ix.map(i=>`<img src="${U(c.images[i][0],500)}" alt="">`).join("")}</div><h4>${b.t}</h4><p>${b.n} pins</p></div>`).join("")}</section>`}
  </div>`;
  const f = document.getElementById("follow");
  f.onclick = () => { const on = f.classList.toggle("solid"); f.textContent = on ? "Follow" : "Following"; };
  document.getElementById("share").onclick = e => {
    const url = location.href;
    (navigator.clipboard?.writeText(url) || Promise.reject()).then(()=>e.target.textContent="Link copied").catch(()=>e.target.textContent=url.split("#")[1]);
  };
}

function open(k){
  const p = pins[k];
  lb.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="${esc(p.title)}">
    <div class="img"><img src="${U(p.id,1400)}" alt="${esc(p.title)}"></div>
    <div class="side">
      <div class="top"><span class="ai">AI ${p.c.kind}</span><button class="x" id="x" aria-label="Close">×</button></div>
      <h3>${esc(p.title)}</h3>
      <div class="prompt"><em>Prompt</em>${esc(p.prompt)}</div>
      <div class="tags" style="justify-content:flex-start">${p.c.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="owner"><img src="${U(p.c.avatar,120)}" alt=""><div><b>${esc(p.c.name)}</b><small>by ${esc(p.c.creator.name)}</small></div><a class="btn solid" style="display:inline-flex;align-items:center" href="#${p.c.id}">View profile</a></div>
    </div></div>`;
  lb.hidden = false;
  document.getElementById("x").focus();
}
const close = () => { lb.hidden = true; lb.innerHTML = ""; };
lb.addEventListener("click", e => { if (e.target===lb || e.target.id==="x" || e.target.closest("a")) close(); });
addEventListener("keydown", e => { if (e.key==="Escape" && !lb.hidden) close(); });

app.addEventListener("click", e => {
  const s = e.target.closest("[data-save]");
  if (s){ e.stopPropagation(); const k=+s.dataset.save; saved.has(k)?saved.delete(k):saved.add(k); s.classList.toggle("on"); s.textContent = saved.has(k)?"Saved":"Save"; return; }
  const f = e.target.closest("[data-f]"); if (f){ filter=f.dataset.f; home(); return; }
  const t = e.target.closest("[data-tab]"); if (t){ tab=t.dataset.tab; route(); return; }
  const pin = e.target.closest(".pin"); if (pin) open(+pin.dataset.k);
});

function route(){
  const h = location.hash.slice(1);
  const c = characters.find(x=>x.id===h);
  c ? profile(c) : home();
}
addEventListener("hashchange", () => { tab="pins"; route(); scrollTo(0,0); });
route();
</script>
</body>
</html>
